name: Polices

on:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_fonts.py'
      - '.github/workflows/fonts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools==4.55.0 brotli==1.1.0 requests==2.32.3
      - run: python tools/fetch_fonts.py
      - name: Enregistrer les polices
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -A
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Polices : mise à jour automatique"
          git push
