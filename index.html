}
function bjSettle() {
  const r = S.bj.round; if (!r || r.phase === 'done') return;
  const natural = !r.split && E.isBlackjack(r.hands[0].cards);
  const dealerBJ = E.isBlackjack(r.dealer);
  const live = r.hands.some(h => E.handValue(h.cards).t <= 21);
  if (!dealerBJ && !natural && live) while (E.dealerHits(r.dealer)) r.dealer.push(bjDraw());
  let ret = 0, staked = 0;
  for (const h of r.hands) {
    staked += h.bet;
    let x, res;
    if (dealerBJ) { x = natural ? h.bet : 0; res = natural ? 'push' : 'lose'; }
    else if (natural) { x = Math.floor(h.bet * 2.5); res = 'bj'; }
    else if (E.handValue(h.cards).t > 21) { x = 0; res = 'bust'; }
    else { x = E.bjReturn(h, r.dealer); res = x > h.bet ? 'win' : x === h.bet ? 'push' : 'lose'; }
    h.ret = x; h.res = res; ret += x;
  }
  r.dealerBJ = dealerBJ; r.phase = 'done'; r.ret = ret; r.staked = staked; r.net = ret - staked;
  S.cash += ret; S.stats.ret += ret; S.stats.rounds++; S.stats.g.bj[0]++; S.stats.g.bj[1] += r.net;
  if (r.net > S.stats.best) S.stats.best = r.net;
  save();
}
async function bjFinish() {
  const r = S.bj.round; if (!r) return;
  U.lock++; U.bj.busy = true;
  try {
    bjRefresh();
    await sleep(RM ? 0 : 320);
    U.bj.hole = true; U.bj.flip = true; Sfx.play('card'); bjRefresh(); U.bj.flip = false;
    for (let i = 2; i < r.dealer.length; i++) { await sleep(RM ? 0 : 560); U.bj.shown = i + 1; Sfx.play('card'); bjRefresh(); }
    await sleep(RM ? 0 : 360);
  } finally {
    U.bj.shown = r.dealer.length; U.bj.hole = true; U.bj.showResult = true; U.bj.busy = false; U.lock--;
    syncMoney(); bjRefresh();
    if (r.net > 0) { Sfx.play(r.hands.some(h => h.res === 'bj') ? 'big' : 'win'); if (r.net >= r.staked * 1.5) FX.burst(70, 0.45); }
    else if (r.net < 0) Sfx.play('lose');

}
function bjHand() { const r = S.bj.round; return r && r.phase === 'player' ? r.hands[r.act] : null; }
function bjAdvance() {
  const r = S.bj.round, i = r.hands.findIndex(h => !h.done);

}
function bjHit() { const h = bjHand(); if (!h || U.bj.busy) return; h.cards.push(bjDraw()); Sfx.play('card'); if (E.handValue(h.cards).t >= 21) h.done = true; bjAdvance(); }
function bjStand() { const h = bjHand(); if (!h || U.bj.busy) return; h.done = true; Sfx.play('tap'); bjAdvance(); }
function bjDouble() {
  const h = bjHand(); if (!h || U.bj.busy || h.cards.length !== 2 || S.cash < h.bet) return;
  S.cash -= h.bet; S.stats.wag += h.bet; h.bet *= 2; h.dbl = true; h.cards.push(bjDraw()); h.done = true;
  syncMoney(); Sfx.play('chip'); bjAdvance();
}
function bjSplit() {
  const r = S.bj.round, h = bjHand();
  if (!h || U.bj.busy || r.hands.length !== 1 || !E.canSplitCards(h.cards) || S.cash < h.bet) return;
  S.cash -= h.bet; S.stats.wag += h.bet; syncMoney(); Sfx.play('chip');
  const [a, b] = h.cards, aces = E.cardRank(a) === 'A';
  r.split = true;
  r.hands = [
    { cards: [a, bjDraw()], bet: h.bet, done: aces, dbl: false, res: null, ret: 0 },
    { cards: [b, bjDraw()], bet: h.bet, done: aces, dbl: false, res: null, ret: 0 },
  ];
  for (const x of r.hands) if (E.handValue(x.cards).t >= 21) x.done = true;

function rlAnimate(n) {
  return new Promise(res => {
    const step = 360 / 37, i = E.WHEEL.indexOf(n);
    const from = U.rl.rot, cur = ((from % 360) + 360) % 360, target = ((-i * step) % 360 + 360) % 360;
    const to = from + 360 * 5 + ((target - cur + 360) % 360);
    const bFrom = U.rl.ball, bTo = bFrom - 360 * 3 - (((bFrom % 360) + 360) % 360);
    const dur = RM ? 250 : 4300, t0 = performance.now(), ease = k => 1 - Math.pow(1 - k, 4);
    const frame = t => {

      U.rl.rot = from + (to - from) * ease(k);
      U.rl.ball = bFrom + (bTo - bFrom) * ease(Math.min(1, k * 1.07));

async function rlSpin() {
  if (U.rl.spinning) return;
  const tot = rlTotal();
  if (!tot) { toast('Pose au moins un jeton sur le tapis.'); return; }
  if (tot > S.cash) { toast('Pas assez d’argent.', { kind: 'bad' }); return; }
  tickPay();
  const bets = Object.assign({}, U.rl.bets);
  S.cash -= tot; S.stats.wag += tot; syncMoney();
  const n = E.spinWheel(); let ret = 0;
  for (const k in bets) ret += bets[k] * E.betReturn(k, n);
  const net = ret - tot;
  S.cash += ret; S.stats.ret += ret; S.stats.rounds++; S.stats.g.rl[0]++; S.stats.g.rl[1] += net;
  if (net > S.stats.best) S.stats.best = net;
  S.rl.hist.unshift(n); if (S.rl.hist.length > 14) S.rl.hist.length = 14;
  save();
  U.rl.last = bets; U.rl.spinning = true; U.rl.result = null; U.lock++;

    U.rl.spinning = false; U.lock--; U.rl.bets = {}; U.rl.stack = []; U.rl.result = { n, net, ret, tot };

function crMain() {
  if (S.cr.round) { crashCash(); return; }
  if (E.phoneTier(S) < 1) return;
  const bet = getBet('cr');
  if (bet > S.cash) { toast('Pas assez d’argent pour cette mise.', { kind: 'bad' }); return; }
  tickPay();
  S.cash -= bet; S.stats.wag += bet; syncMoney();
  S.cr.round = { bet, t0: now(), cp: E.crashPoint(), auto: S.set.crAuto || 0 };
  U.cr.last = null; save(); Sfx.play('chip');
  const c = $('#lkCtl'); if (c) c.innerHTML = lkCtlHTML();
  startCrashLoop();
}
function crashStep() {
  const r = S.cr.round; if (!r) return;
  const m = E.crashMult(now() - r.t0);
  if (r.auto && r.auto <= r.cp && m >= r.auto) { crashCash(r.auto); return; }
  if (m >= r.cp) crashBust();
}
function crashEnd(r, ret, kind, m) {
  const net = ret - r.bet;
  S.cash += ret; S.stats.ret += ret; S.stats.rounds++; S.stats.g.cr[0]++; S.stats.g.cr[1] += net;
  if (net > S.stats.best) S.stats.best = net;
  S.cr.hist.unshift(r.cp); if (S.cr.hist.length > 12) S.cr.hist.length = 12;
  S.cr.round = null;
  U.cr.last = { kind, m, t: E.crashTime(Math.max(1, m)), ret, cp: r.cp };
  save(); syncMoney();
  const c = $('#lkCtl'); if (c) c.innerHTML = lkCtlHTML();
  const h = $('#lkHist'); if (h) h.innerHTML = lkHistHTML();
  crashPaint();
  afterCasino(net, r.bet);
}
function crashCash(at) {
  const r = S.cr.round; if (!r) return;
  const m = at || E.crashMult(now() - r.t0);
  if (m >= r.cp && !(at && at <= r.cp)) { crashBust(); return; }
  const ret = Math.floor(r.bet * m);
  Sfx.play('cash');
  if (!luckyVisible()) toast(`Crash : encaissé à ${E.mult(m)}, +${E.euro(ret)}`, { kind: 'good', icon: '🚀' });
  crashEnd(r, ret, 'cash', m);
  if (ret - r.bet >= r.bet * 9) FX.burst(90);
}
function crashBust() {
  const r = S.cr.round; if (!r) return;
  Sfx.play('crash');
  if (!luckyVisible()) toast(`Crash à ${E.mult(r.cp)} : mise de ${E.euro(r.bet)} perdue`, { kind: 'bad', icon: '💥' });
  crashEnd(r, 0, 'crash', r.cp);
}
function crashPaint() {
  const cv = $('#crashCv'); if (!cv) return;
  const r = S.cr.round, L = U.cr.last;
  let t = 0, m = 1, mode = 'idle';
  if (r) { t = now() - r.t0; m = Math.min(E.crashMult(t), r.cp); mode = 'live'; }
  else if (L) { t = L.t; m = L.m; mode = L.kind; }
  const mult = $('#lkMult'), sub = $('#lkSub'), btn = $('#lkBtn');
  if (mult) { mult.textContent = E.mult(m); mult.className = 'lk-mult ' + mode; }
  if (sub) sub.textContent = mode === 'live' ? `Mise ${E.euro(r.bet)}${r.auto ? ' · auto à ' + E.mult(r.auto) : ''}` : mode === 'cash' ? `Encaissé : +${E.euro(L.ret)} (crash à ${E.mult(L.cp)})` : mode === 'crash' ? (L.cp <= 1 ? 'Crash immédiat !' : 'Crash ! Mise perdue') : 'Mise, puis encaisse avant le crash';
  if (btn && r) btn.textContent = 'Encaisser ' + E.euroFit(Math.floor(r.bet * m), 1e6);
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const tMax = Math.max(6000, t * 1.12), mMax = Math.max(2, m * 1.2), pad = 14;
  const X = tt => pad + (w - pad * 2) * (tt / tMax);
  const Y = mm => h - pad - (h - pad * 2) * ((mm - 1) / (mMax - 1));
  g.lineWidth = 1; g.font = '600 10px Figtree, system-ui, sans-serif'; g.textBaseline = 'bottom'; g.textAlign = 'left';
  const marks = [1.5, 2, 3, 5, 10, 20, 50, 100, 200, 500, 1000].filter(v => v < mMax);
  for (const gm of marks.slice(-4)) {
    const y = Y(gm);
    g.strokeStyle = 'rgba(243,236,219,.09)'; g.beginPath(); g.moveTo(pad, y); g.lineTo(w - pad, y); g.stroke();
    g.fillStyle = 'rgba(243,236,219,.4)'; g.fillText('×' + String(gm).replace('.', ','), pad + 2, y - 2);
  }
  if (mode === 'idle') return;
  const col = mode === 'crash' ? '#FF8B7B' : mode === 'cash' ? '#8BE3B5' : '#E3B65D';
  const pts = [];
  for (let i = 0; i <= 48; i++) { const tt = t * i / 48; pts.push([X(tt), Y(Math.min(m, Math.exp(E.CRASH_K * tt / 1000)))]); }
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, mode === 'crash' ? 'rgba(255,139,123,.35)' : 'rgba(227,182,93,.35)'); grad.addColorStop(1, 'rgba(227,182,93,0)');
  g.beginPath(); g.moveTo(pts[0][0], h - pad); pts.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(pts[pts.length - 1][0], h - pad); g.closePath(); g.fillStyle = grad; g.fill();
  g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.strokeStyle = col; g.lineWidth = 3; g.lineJoin = 'round'; g.stroke();
  const tip = pts[pts.length - 1];
  g.font = '22px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(mode === 'crash' ? '💥' : '🚀', Math.min(w - 16, tip[0]), Math.max(16, tip[1] - 6));
}

/* ===== PROFILE, SETTINGS, RESET ===== */
function profileEdit() {
  U.introAva = S.avatar;
  Sheet.open(() => `<div class="form">
    <label for="edName">Pseudo</label>
    <input id="edName" maxlength="16" autocomplete="off" value="${esc(S.name)}">
    <p class="lbl">Avatar</p>
    <div class="ava-grid">${AVATARS.map(a => `<button class="ava-pick ${U.introAva === a ? 'on' : ''}" data-act="pick-ava" data-arg="${a}" aria-label="Avatar ${a}" aria-pressed="${U.introAva === a}">${a}</button>`).join('')}</div>
    <button class="btn btn-brass btn-block" data-act="profile-save">Enregistrer</button>
  </div>`, { title: 'Ton profil' });
}
function profileSave() {
  const v = ($('#edName').value || '').trim().slice(0, 16);
  if (v) S.name = v;
  S.avatar = U.introAva || S.avatar;
  save(); Sheet.close(); render(true);
}
function pickAva(a) {
  U.introAva = a;
  $$('.ava-pick').forEach(b => { const on = b.dataset.arg === a; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
function resetAsk() {
  Sheet.open(`<div class="form">
    <p>Ton argent, tes biens, ton niveau et tes messages seront effacés${Cloud.state === 'on' ? ', ici et sur ton compte' : ''}. Tu repartiras avec 100 € et ton studio.</p>
    <div class="row2"><button class="btn btn-ghost" data-act="sheet-close" data-autofocus>Annuler</button><button class="btn btn-danger" data-act="reset-do">Tout effacer</button></div>
  </div>`, { title: 'Recommencer à zéro ?' });
}
async function resetDo() {
  Sheet.close(); closePhone();
  S = null; clearLocal(); await Cloud.wipe();
  U.casino = 'lobby'; U.tab = 'travail'; U.rl.bets = {}; U.rl.stack = []; U.rl.last = null; U.rl.result = null; U.sl.view = null; U.sl.msg = ''; U.cr.last = null;
  $('#view').innerHTML = '';
  showIntro();
}

/* ===== ONBOARDING, OFFLINE, CONFLICTS ===== */
const LOGO = '<span class="logo-mark">Flambeur</span>';
function showIntro(mode) {
  const el = $('#intro'); el.hidden = false;
  document.body.classList.add('noscroll');
  if (mode === 'splash') { el.innerHTML = `<div class="intro-in"><h1 class="logo">${LOGO}</h1><p class="tagline">Chargement de ta partie…</p></div>`; return; }
  U.onboarding = true; U.introAva = U.introAva || AVATARS[0];
  el.innerHTML = `<div class="intro-in">
    <h1 class="logo">${LOGO}</h1>
    <p class="tagline">De fauché à propriétaire du casino.</p>
    <div class="intro-card form">
      <p>Tu démarres avec <b>100 €</b>, un studio de 12 m² et un vieux téléphone. Travaille, joue au casino, achète tout ce qui brille… et rachète le Grand Casino.</p>
      <label for="inName">Ton pseudo</label>
      <input id="inName" maxlength="16" autocomplete="off" placeholder="Ex. : Lucky Luc">
      <p class="lbl">Ton avatar</p>
      <div class="ava-grid">${AVATARS.map(a => `<button class="ava-pick ${U.introAva === a ? 'on' : ''}" data-act="pick-ava" data-arg="${a}" aria-label="Avatar ${a}" aria-pressed="${U.introAva === a}">${a}</button>`).join('')}</div>
      <button class="btn btn-brass btn-block btn-xl" data-act="start">Commencer</button>
    </div>
  </div>`;
}
function hideIntro() { const el = $('#intro'); el.hidden = true; el.innerHTML = ''; U.onboarding = false; if (!U.sheet && !U.ph.open) document.body.classList.remove('noscroll'); }
function startNew() {
  const inp = $('#inName');
  const name = ((inp && inp.value) || '').trim().slice(0, 16) || 'Flambeur';
  S = newGame(name, U.introAva || AVATARS[0]);
  U.tab = 'travail'; U.casino = 'lobby'; U.shopCat = 'tout';
  pushMsg('maman', 'Ça y est, tu as ton studio ! 12 m², c’est petit mais c’est chez toi 😘', null, true);
  pushMsg('maman', 'Et pas de casino, hein. Je te connais.', null, true);
  pushMsg('kevin', 'Le Grand Casino est juste en bas de chez toi. On y passe ce soir ? 🎰', null, true);
  pushMsg('boulot', JOB.petits.hello, JOB.petits.boss, true);
  Sfx.play('buy');
  startGame();
  save();
}
function startGame(o = {}) {
  hideIntro();
  bjInitUI();
  U.rl.result = null; U.rl.bets = {}; U.rl.stack = []; U.sl.view = null; U.sl.msg = ''; U.cr.last = null;
  U.shown = S.cash; setMoneyText(S.cash);
  const away = now() - (S.tick || now());
  E.accrue(S, now());
  if (S.cr.round) crashStep();
  $('#app').hidden = false;
  render(true);
  if (o.welcomeBack && away > 2 * 60e3 && S.pay >= 1) offlineSheet(away);
}
function offlineSheet(away) {
  const r = E.rateOf(S), capped = S.pay >= r.rate * E.PAY_CAP_MIN - 0.01;
  Sheet.open(`<div class="welcome">
    <p class="eyebrow">Pendant ton absence · ${E.duration(away)}</p>
    <div class="big-num good">+${E.euro(S.pay)}</div>
    <p class="muted">Ta paie de ${JOB[S.job].name} t’attend${capped ? '. Elle a atteint son plafond de 8 h : reviens plus souvent pour ne rien perdre' : ''}.</p>
    <button class="btn btn-brass btn-block btn-xl" data-act="offline-collect" data-autofocus>Encaisser</button>
  </div>`, { title: `Bon retour, ${S.name}` });
}
function saveSummary(s) {
  const w = E.netWorth(s, now());
  return `Niveau ${E.levelOf(s.xp)} · ${JOB[s.job] ? JOB[s.job].name : ''} · patrimoine ${E.euroShort(w)} · jouée ${ago(s.savedAt || s.created)}`;
}
function conflictSheet(cloudState) {
  U.conflict = cloudState;
  Sheet.open(`<div class="form">
    <p>Ton compte contient une autre partie que celle de cet appareil. Laquelle veux-tu garder ? L’autre sera remplacée.</p>
    <div class="choice"><p class="eyebrow">Sur ton compte</p><p><b>${esc(cloudState.name)}</b> ${cloudState.avatar}</p><p class="small muted">${saveSummary(cloudState)}</p><button class="btn btn-brass btn-block" data-act="conflict-cloud">Garder celle du compte</button></div>
    <div class="choice"><p class="eyebrow">Sur cet appareil</p><p><b>${esc(S.name)}</b> ${S.avatar}</p><p class="small muted">${saveSummary(S)}</p><button class="btn btn-ghost btn-block" data-act="conflict-local">Garder celle-ci</button></div>
  </div>`, { title: 'Deux parties trouvées' });
}
function adopt(state) {
  S = migrate(state); saveLocal();
  closePhone(); Sheet.close();
  startGame({ welcomeBack: true });
}
function reconcile(res) {
  if (Cloud.state !== 'on' || !S) return;
  if (!res || !validSave(res.state)) { Cloud.dirty(); return; }
  if (res.gid === S.gid) {
    if ((res.savedAt || 0) > (S.savedAt || 0) + 1000) { if (!U.rl.spinning && !U.sl.spinning && !U.bj.busy && !S.cr.round) { adopt(res.state); toast('Partie synchronisée avec ton compte.', { icon: '☁️' }); } }
    else if ((S.savedAt || 0) > (res.savedAt || 0)) Cloud.dirty();
    return;
  }
  conflictSheet(res.state);
}

/* ===== EVENTS ===== */
const A = {
  tab: a => { Sheet.close(); closePhone(); goTab(a); },
  collect: doCollect,
  'offline-collect': () => { Sheet.close(); doCollect(); },
  apply: applyJob,
  item: openItem,
  buy, sell,
  'sell-cancel': () => { U.sellConfirm = null; Sheet.refresh(); },
  'shop-cat': a => { U.shopCat = a; render(true); },
  'goto-shop': a => { closePhone(); Sheet.close(); U.tab = 'boutique'; U.shopCat = a; render(true); window.scrollTo(0, 0); },
  casino: a => { if (U.rl.spinning || U.sl.spinning) { toast('Attends la fin du tour.'); return; } U.casino = a; render(true); window.scrollTo(0, 0); },
  'bet-step': a => { const [g, d] = a.split(':'); betStep(g, +d); },
  'bet-max': betMax,
  'bj-deal': bjDeal, 'bj-hit': bjHit, 'bj-stand': bjStand, 'bj-double': bjDouble, 'bj-split': bjSplit,
  'rl-chip': a => { U.rl.chip = +a; Sfx.play('tick'); $('#rlDock').innerHTML = rlDockHTML(); },
  'rl-bet': rlBet, 'rl-undo': rlUndo, 'rl-clear': rlClear, 'rl-rebet': rlRebet, 'rl-spin': rlSpin,
  'sl-spin': slSpin,
  'phone-open': () => openPhone('home'),
  'phone-close': closePhone,
  'phone-home': phoneHome,
  'phone-back': phoneBack,
  'phone-app': openApp,
  thread: openThread,
  'cr-main': crMain,
  'cr-auto': a => { S.set.crAuto = +a; Sfx.play('tick'); const c = $('#lkCtl'); if (c) c.innerHTML = lkCtlHTML(); save(); },
  'ot-open': otOpen, 'ot-go': otGo,
  'sheet-close': () => Sheet.close(),
  'profile-edit': profileEdit, 'profile-save': profileSave, 'pick-ava': pickAva,
  credits: creditsSheet,
  sound: () => { S.set.sound = !S.set.sound; save(); Sfx.play('tap'); if (U.ph.open) renderPhone(); if (U.tab === 'profil') render(true); },
  wall: a => { S.set.wall = +a; save(); renderPhone(); },
  'reset-ask': resetAsk, 'reset-do': resetDo,
  start: startNew,
  'conflict-cloud': () => { const c = U.conflict; U.conflict = null; if (c) { adopt(c); toast('Partie du compte chargée.', { icon: '☁️' }); } },
  'conflict-local': () => { U.conflict = null; Sheet.close(); Cloud.dirty(); toast('Cette partie remplace celle du compte.', { icon: '☁️' }); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (!S && !['start', 'pick-ava'].includes(el.dataset.act)) return;
  e.preventDefault();
  if (el.classList.contains('toast')) el.remove();
  fn(el.dataset.arg, el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (U.sheet) Sheet.close(); else if (U.ph.open) closePhone();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'inName') { e.preventDefault(); startNew(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'edName') { e.preventDefault(); profileSave(); }
});
document.addEventListener('visibilitychange', () => {
  if (!S) return;
  if (document.hidden) { U.hiddenAt = now(); E.accrue(S, now()); saveLocal(); Cloud.flush(); }
  else {
    const away = U.hiddenAt ? now() - U.hiddenAt : 0;
    E.accrue(S, now()); updatePay();
    if (S.cr.round) crashStep();
    if (away > 10 * 60e3 && !U.sheet && S.pay >= 1) offlineSheet(away);
    if (luckyVisible()) startCrashLoop();
  }
});
window.addEventListener('pagehide', () => { if (S) { E.accrue(S, now()); saveLocal(); Cloud.flush(); } });
setInterval(() => {
  if (!S) return;
  E.accrue(S, now());
  updatePay(); updateOt(); updatePhoneClock();
  if (S.cr.round && !luckyVisible()) crashStep();
}, 250);

/* ===== BOOT ===== */
function boot(hotData) {
  loadUI();
  const hotState = hotData && hotData.state;
  let local = hotState || loadLocal();
  if (local && !validSave(local)) local = null;
  let cloudRes, cloudDone = false;
  const cloudP = Cloud.init().then(r => { cloudRes = r; cloudDone = true; return r; });
  if (local) {
    S = migrate(local);
    startGame({ welcomeBack: !hotState });
    cloudP.then(reconcile);
    return;
  }
  showIntro('splash');
  Promise.race([cloudP, sleep(2500)]).then(() => {
    if (cloudDone && cloudRes && validSave(cloudRes.state)) { S = migrate(cloudRes.state); saveLocal(); startGame({ welcomeBack: true }); return; }
    showIntro();
    if (!cloudDone) cloudP.then(r => {
      if (!r || !validSave(r.state)) { if (S) Cloud.dirty(); return; }
      if (!S) { S = migrate(r.state); saveLocal(); startGame({ welcomeBack: true }); toast('Partie retrouvée sur ton compte.', { icon: '☁️' }); }
      else reconcile(r);
    });
  });
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ state: S ? JSON.parse(JSON.stringify(S)) : null })); } catch (e) { /* optional */ } }
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
